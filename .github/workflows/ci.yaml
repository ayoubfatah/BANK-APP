name: ci-test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: illchangeitlater
          POSTGRES_DB: bank-app
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.27.1"
        id: go
      - name: Build
        run: go build -v ./...

      - name: installing golang migration package
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.20.1/migrate.darwin-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/
          which migrate 
      - name: Run migrations
        run: make migrationup

      - name: Test
        run: make test
